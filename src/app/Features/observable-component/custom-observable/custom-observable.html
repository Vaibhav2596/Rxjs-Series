<div class="my-3">
  <h2>Custom Observable</h2>
  <br />

  <div class="row">
    <div class="col-md-6">
      <strong>Ex - 01 (Manual)</strong>
      <hr />
      <ul [ngClass]="techStatus == 'completed' ? 'completed' : techStatus == 'error' ? 'error' : ''" class="techList" id="elContainer">
      </ul>
    </div>

    <div class="col-md-6">
      <strong>Ex - 02 (Custom Interval Observable)</strong>
      <hr />
      <ul class="techList">
        <li>Angular</li>
        <li>Typescript</li>
        <li>Html and Css</li>
      </ul>
    </div>
  </div>

  <br />

  <div class="row">
    <div class="col-md-12">
      <strong>Ex - 03 (Random Names)</strong>
      <p class="bg-light py-2 px-3 border rounded">
        <strong>Random Names: </strong>
        'Anup', 'Shekhar', 'Sharma', 'Uxtrendz', 'John', 'Alex', 'Robert'
      </p>
      <hr />
      <p>Current Name : <strong class="text-success">Anup</strong></p>
      <span class="badge text-bg-success">Success</span>
    </div>
  </div>
</div>
